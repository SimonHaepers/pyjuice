[workspace]
name = "pyjuice-dense-hmm"
description = "Pixi environment for the dense SumLayer fast-path branch of pyjuice"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
numpy = "*"
networkx = "*"
numba = "*"
packaging = "*"
matplotlib = "*"
pillow = "*"
tqdm = "*"
typing_extensions = "*"
torch = ">=2.2.0"
triton = ">=2.2.0"
pyjuice = { path = ".", editable = true }
sphinx = ">=9.1.0,<10"
sphinx-gallery = ">=0.21.0,<0.22"
sphinx-rtd-theme = ">=3.1.0, <4"

[feature.dev.pypi-dependencies]
pytest = "*"
pytest-xdist = "*"
pytest-skip-slow = "*"
torchvision = "*"
datasets = "*"
flake8 = "*"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
